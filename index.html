<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gran Montana</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 35%),
                linear-gradient(145deg, #071b16, #0c2b22 50%, #06120f);
            color: #fff;
            overflow: hidden;
        }

        /* CAPA DE LUZ */
        .light {
            position: fixed;
            width: 450px;
            height: 450px;
            background: rgba(210, 177, 92, 0.08);
            filter: blur(100px);
            border-radius: 50%;
            top: -180px;
            right: -120px;
            pointer-events: none;
        }

        .light2 {
            position: fixed;
            width: 350px;
            height: 350px;
            background: rgba(255,255,255,0.04);
            filter: blur(100px);
            border-radius: 50%;
            bottom: -180px;
            left: -120px;
            pointer-events: none;
        }

        /* CONTENEDOR PRINCIPAL */
        .lobby {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 520px;
            text-align: center;
            animation: entrance 1s ease forwards;
        }

        /* LOGO */
        .logo-box {
            width: 170px;
            height: 170px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logo-box::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid rgba(212, 181, 102, 0.35);
            box-shadow:
                0 0 35px rgba(212, 181, 102, 0.08),
                inset 0 0 25px rgba(212, 181, 102, 0.04);
        }

        .logo-box img {
            width: 145px;
            height: 145px;
            object-fit: contain;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.35));
        }

        /* TEXTO */
        .welcome {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #d4b566;
            margin-bottom: 9px;
            font-weight: 500;
        }

        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(38px, 10vw, 58px);
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255,255,255,0.68);
            font-size: 15px;
            line-height: 1.6;
            margin: 0 auto 38px;
            max-width: 390px;
        }

        /* TARJETA */
        .menu-card {
            background: rgba(255,255,255,0.055);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 25px;
            padding: 20px;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
        }

        .card-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 15px;
        }

        /* BOTONES */
        .button {
            width: 100%;
            min-height: 72px;
            border-radius: 17px;
            border: 1px solid rgba(212,181,102,0.35);
            background: linear-gradient(
                135deg,
                rgba(255,255,255,0.09),
                rgba(255,255,255,0.035)
            );
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 0 20px;
            margin-top: 12px;
            transition:
                transform 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .button:first-of-type {
            margin-top: 0;
        }

        .button::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
            right: -70px;
            top: -45px;
            transition: 0.35s ease;
        }

        .button:hover {
            transform: translateY(-3px);
            background: rgba(212,181,102,0.12);
            border-color: rgba(212,181,102,0.65);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }

        .button:hover::after {
            transform: scale(1.5);
        }

        .icon {
            width: 43px;
            height: 43px;
            border-radius: 13px;
            background: rgba(212,181,102,0.13);
            border: 1px solid rgba(212,181,102,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 21px;
            flex-shrink: 0;
        }

        .button-text {
            text-align: left;
            position: relative;
            z-index: 2;
        }

        .button-title {
            display: block;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .button-description {
            display: block;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }

        .arrow {
            margin-left: auto;
            font-size: 22px;
            color: #d4b566;
            position: relative;
            z-index: 2;
            transition: transform 0.25s ease;
        }

        .button:hover .arrow {
            transform: translateX(5px);
        }

        /* FOOTER */
        footer {
            margin-top: 27px;
            color: rgba(255,255,255,0.35);
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        .gold-line {
            width: 35px;
            height: 1px;
            background: #d4b566;
            opacity: 0.7;
            margin: 0 auto 13px;
        }

        /* ANIMACIÓN */
        @keyframes entrance {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* PANTALLAS PEQUEÑAS */
        @media (max-width: 480px) {

            .lobby {
                padding: 18px;
            }

            .logo-box {
                width: 135px;
                height: 135px;
                margin-bottom: 20px;
            }

            .logo-box img {
                width: 115px;
                height: 115px;
            }

            .welcome {
                font-size: 11px;
                letter-spacing: 3px;
            }

            h1 {
                font-size: 40px;
            }

            .subtitle {
                font-size: 14px;
                margin-bottom: 28px;
            }

            .menu-card {
                padding: 15px;
                border-radius: 21px;
            }

            .button {
                min-height: 68px;
            }
        }

        /* REDUCE ANIMACIONES SI EL USUARIO LO PREFIERE */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="light"></div>
    <div class="light2"></div>

    <main class="lobby">

        <div class="container">

            <!-- LOGO -->
            <div class="logo-box">
                <img
                    src="8A0B2565-202D-46B1-95F3-A6BEAEA9CD47.png"
                    alt="Gran Montana"
                >
            </div>

            <!-- ENCABEZADO -->
            <div class="welcome">
                Bienvenido
            </div>

            <h1>Gran Montana</h1>

            <p class="subtitle">
                Descubre nuestra experiencia, conoce más sobre nosotros
                o consulta nuestro menú.
            </p>

            <!-- LOBBY -->
            <section class="menu-card">

                <div class="card-title">
                    Lobby Digital
                </div>

                <!-- PÁGINA WEB -->
                <a
                    class="button"
                    href="https://granmontana.com"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <div class="icon">
                        ◉
                    </div>

                    <div class="button-text">
                        <span class="button-title">
                            Página Web
                        </span>

                        <span class="button-description">
                            Conoce Gran Montana
                        </span>
                    </div>

                    <div class="arrow">
                        →
                    </div>
                </a>

                <!-- MENÚ -->
                <a
                    class="button"
                    href="https://menumontana.wordpress.com"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <div class="icon">
                        ☰
                    </div>

                    <div class="button-text">
                        <span class="button-title">
                            Nuestro Menú
                        </span>

                        <span class="button-description">
                            Consulta nuestro menú digital
                        </span>
                    </div>

                    <div class="arrow">
                        →
                    </div>
                </a>

            </section>

            <!-- PIE -->
            <footer>
                <div class="gold-line"></div>
                GRAN MONTANA
            </footer>

        </div>

    </main>

    <script>
        // Pequeño efecto de interacción al tocar los botones
        document.querySelectorAll(".button").forEach(button => {

            button.addEventListener("click", function() {

                this.style.transform = "scale(0.98)";

                setTimeout(() => {
                    this.style.transform = "";
                }, 120);

            });

        });
    </script>

</body>
</html>
